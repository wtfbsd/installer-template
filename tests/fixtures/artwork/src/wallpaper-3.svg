<?xml version="1.0" encoding="UTF-8"?>
<!-- @NAME@ wallpaper 3: minimal dark with a small wordmark bottom-right.
     Tokens are substituted by scripts/render.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <title>@NAME@ wallpaper 3</title>
  <defs>
    <linearGradient id="wall3-bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#@DARK2@"/>
      <stop offset="1" stop-color="#@DARK@"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#wall3-bg)"/>
  <g transform="translate(1788,988) scale(0.125)">
    <rect x="0" y="0" width="448" height="448" rx="104" ry="104" fill="#@PRIMARY@"/>
    <rect x="80" y="104" width="288" height="48" rx="24" ry="24" fill="#@LIGHT@"/>
    <rect x="80" y="200" width="208" height="48" rx="24" ry="24" fill="#@ACCENT@"/>
    <rect x="80" y="296" width="288" height="48" rx="24" ry="24" fill="#@LIGHT@"/>
  </g>
  <text x="1764" y="1024" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#@LIGHT@">@NAME@</text>
</svg>
