<?xml version="1.0" encoding="UTF-8"?>
<!-- @NAME@ installer sidebar panel, 200x600. Tokens are substituted by scripts/render.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 600" width="200" height="600">
  <title>@NAME@ installer sidebar</title>
  <defs>
    <linearGradient id="sidebar-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#@DARK2@"/>
      <stop offset="1" stop-color="#@DARK@"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="200" height="600" fill="url(#sidebar-bg)"/>
  <g transform="translate(40,40) scale(0.267857)">
    <rect x="0" y="0" width="448" height="448" rx="104" ry="104" fill="#@PRIMARY@"/>
    <rect x="80" y="104" width="288" height="48" rx="24" ry="24" fill="#@LIGHT@"/>
    <rect x="80" y="200" width="208" height="48" rx="24" ry="24" fill="#@ACCENT@"/>
    <rect x="80" y="296" width="288" height="48" rx="24" ry="24" fill="#@LIGHT@"/>
  </g>
  <text x="100" y="208" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" fill="#@LIGHT@">@NAME@</text>
  <rect x="66" y="228" width="68" height="4" rx="2" ry="2" fill="#@ACCENT@"/>
  <g transform="translate(-40,430) scale(0.625)">
    <rect x="0" y="0" width="448" height="448" rx="104" ry="104" fill="#@LIGHT@" fill-opacity="0.055"/>
    <rect x="80" y="104" width="288" height="48" rx="24" ry="24" fill="#@DARK@" fill-opacity="0.4"/>
    <rect x="80" y="200" width="208" height="48" rx="24" ry="24" fill="#@ACCENT@" fill-opacity="0.3"/>
    <rect x="80" y="296" width="288" height="48" rx="24" ry="24" fill="#@DARK@" fill-opacity="0.4"/>
  </g>
</svg>
