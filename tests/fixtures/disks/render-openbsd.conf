# The pictures of the installer for openbsd (tools/render-fixtures): the
# disks, the hardware and the network adapter of the captured outputs of
# openbsd (../captures/openbsd, ../hw-captures/openbsd): sd1 is empty, sd2
# holds Windows and Debian.  The disks are the small disks of the capture
# machine (render-fixtures sets MIN_DISK_GB=1 for these pictures).

DISKS=sd1|VirtIO disk|1073741824,sd2|VirtIO disk|4294967296
DISKS_CAPTURE=../captures/openbsd/01-blank:../captures/openbsd/02-windows-linux-gpt
DISKS_SNIFFS=render-openbsd-sniffs.json
HARDWARE_CAPTURE=../hw-captures/openbsd
INTERFACES=vio0|VirtIO network
LICENSED_CATALOGUE=../software/licensed-software.json
ONLINE=yes
