# The pictures of the installer for netbsd (tools/render-fixtures): the
# disks, the hardware and the network adapter of the captured outputs of
# netbsd (../captures/netbsd, ../hw-captures/netbsd): ld1 is empty, ld2
# holds Windows and Debian.  The disks are the small disks of the capture
# machine (render-fixtures sets MIN_DISK_GB=1 for these pictures).

DISKS=ld1|VirtIO disk|1073741824,ld2|VirtIO disk|4294967296
DISKS_CAPTURE=../captures/netbsd/01-blank:../captures/netbsd/02-windows-linux-gpt
DISKS_SNIFFS=render-netbsd-sniffs.json
HARDWARE_CAPTURE=../hw-captures/netbsd
INTERFACES=vioif0|VirtIO network
LICENSED_CATALOGUE=../software/licensed-software.json
ONLINE=yes
