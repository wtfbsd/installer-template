#
# The pictures of the installer for dragonfly (tools/render-fixtures): the
# disks, the hardware and the network adapter of the captured outputs of
# dragonfly (../captures/dragonfly, ../hw-captures/dragonfly): vbd1 is empty, vbd2
# holds Windows and Debian.  The disks are the small disks of the capture
# machine (render-fixtures sets MIN_DISK_GB=1 for these pictures).

DISKS=vbd1|VirtIO disk|1073741824,vbd2|VirtIO disk|4294967296
DISKS_CAPTURE=../captures/dragonfly/01-blank:../captures/dragonfly/02-windows-linux-gpt
DISKS_SNIFFS=render-dragonfly-sniffs.json
HARDWARE_CAPTURE=../hw-captures/dragonfly
INTERFACES=vtnet0|VirtIO network
LICENSED_CATALOGUE=../software/licensed-software.json
ONLINE=yes
