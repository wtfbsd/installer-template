#
# The adapter fixture: the FreeBSD adapter reads this file instead of asking
# the machine for hardware.  It lets the test suite drive the installer on a
# machine that is not the install target, and it lets a site rehearse the
# installer.
#
# DISKS and INTERFACES hold a comma separated list of items.  An item is the
# name of the disk or adapter, and it may carry a description and a size in
# bytes after a bar:
#
#   name
#   name|description
#   name|description|size in bytes
#
# INSTALL_EXIT is the exit code the rehearsed installation returns.  It is 0
# when the key is not there.

DISKS=ada0|Samsung SSD 860|500107862016,ada1|Samsung SSD 870|1000204886016
INTERFACES=em0|Intel I219-LM,em1|Intel I210-T1
