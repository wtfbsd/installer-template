#
# The installer configuration.  It is KEY=value text and it is parsed, never
# sourced: no value is ever expanded, evaluated or executed.
#
# PRODUCT_NAME     the name the installer calls itself
# PRODUCT_SLUG     the lower case name used for file names and URLs
# OS               the operating system the installer runs on
# DEFAULT_KEYMAP  the keyboard layout the installer offers first
# DEFAULT_TZ       the time zone the installer offers first

PRODUCT_NAME=ExampleBSD
PRODUCT_SLUG=examplebsd
OS=freebsd
DEFAULT_KEYMAP=us
DEFAULT_TZ=UTC
